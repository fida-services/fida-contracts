name: "Continuous Integration"
on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Test
      run: sbt test
    - name: Generate Plutus scripts and PureScript module
      run: sbt "run -o out/scripts" "run -n Fida.RawScripts -p out/purs/Fida/RawScripts.purs"
    - name: Upload Plutus scripts and PureScript module
      uses: actions/upload-artifact@v4
      with:
        name: fida-contracts-scripts
        path: out/
        if-no-files-found: error
